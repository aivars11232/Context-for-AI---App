[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "context-for-ai"
version = "0.1.0"
description = "A local desktop context-understanding layer for AI interactions"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8,<7",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
]

[project.scripts]
context-for-ai = "context_for_ai.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -m 'not ollama'"
markers = [
    "ollama: opt-in local Ollama acceptance test",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["context_for_ai*"]

[tool.setuptools.package-data]
context_for_ai = ["ui/qml/*.qml", "ui/qml/**/*.qml"]
